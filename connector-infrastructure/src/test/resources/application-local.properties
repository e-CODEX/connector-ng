##################################################################################
# Local development: MySQL and ActiveMQ from Docker Compose (no embedded JMS broker).
#
#   docker compose up -d connector-ng-db activemq
#   ./gradlew :connector-bootstrapper:bootRun --args='--spring.profiles.active=local'
#
# Requires MinIO (or compatible S3) if you exercise attachment storage; see README.md.
#
# Credentials match docker-compose.yml (connector-ng-db, activemq).
##################################################################################

##################################################################################
############################ BUSINESS DOMAIN CONFIGURATIONS ######################
##################################################################################
# default business domain configuration
# is not set, a default domain will be created by the connector on startup
connector.business-domains.defaults[0].identifier=default_business_domain
connector.business-domains.defaults[0].description=default business domain
connector.business-domains.defaults[0].enabled=true

##################################################################################
############################ MESSAGE PROCESSING CONFIGURATIONS ###################
##################################################################################
connector.message-processing.send-generated-evidences-to-backend=true
connector.message-processing.auto-trigger-delivery-evidences=false
connector.message-processing.ebms-id-generator-enabled=true
connector.message-processing.ebms-id-suffix=connector.ecodex.eu
connector.message-processing.identifier-suffix=connector.ecodex.eu
connector.message-processing.transport-id-suffix=connector.ecodex.eu
connector.message-processing.outbound-verification-mode=STRICT
connector.message-processing.inbound-verification-mode=RELAXED

##################################################################################
################################## QUEUES CONFIGURATIONS #########################
##################################################################################
connector.queues.outbound-message-staging-queue=connector.queues.outbound-message-staging-queue
connector.queues.outbound-message-processing-queue=connector.queues.outbound-message-processing-queue
connector.queues.outbound-evidence-trigger-queue=connector.queues.outbound-evidence-trigger-queue
connector.queues.inbound-message-staging-queue=connector.queues.inbound-message-staging-queue
connector.queues.inbound-message-processing-queue=connector.queues.inbound-message-processing-queue
connector.queues.inbound-evidence-trigger-queue=connector.queues.inbound-evidence-trigger-queue
connector.queues.backend-delivery-queue=connector.queues.backend-delivery-queue

##################################################################################
################################## GATEWAY CONFIGURATIONS ########################
##################################################################################
connector.queues.gateway-submission-queue=domibus.backend.jms.inQueue
connector.queues.gateway-submission-reply-queue=domibus.backend.jms.replyQueue
connector.queues.gateway-reception-queue=domibus.backend.jms.outQueue

##################################################################################
############################### DATABASE CONFIGURATIONS ##########################
##################################################################################
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

##################################################################################
############################### ACTIVE MQ CONFIGURATIONS #########################
##################################################################################
spring.activemq.broker-url=tcp://127.0.0.1:61616
spring.activemq.user=admin
spring.activemq.password=admin

spring.jta.enabled=false
#spring.jta.log-file=./data/jtalog
#
#spring.jta.atomikos.datasource.max-pool-size=60
#spring.jta.atomikos.connectionfactory.max-pool-size=60
#
#spring.jta.atomikos.properties.default-jta-timeout=3m
#spring.jta.atomikos.properties.max-timeout=3m

##################################################################################
############################## FILE STORAGE CONFIGURATIONS #######################
##################################################################################
connector.file.storage.upload-temp-directory=./data/upload-tmp
connector.file.storage.s3.secret-key=admin123
connector.file.storage.s3.access-key=admin
connector.file.storage.s3.region=us-east-1
connector.file.storage.s3.bucket=attachments
connector.file.storage.s3.endpoint=http://127.0.0.1:9000

##################################################################################
################################ MULTIPART CONFIGURATIONS ########################
##################################################################################
spring.servlet.multipart.location=${connector.file.storage.upload-temp-directory}

##################################################################################
######################## CONTAINER CONFIGURATIONS ################################
##################################################################################
# Settings for the security library for generating the Token.
# ecodex container validation and creation
connector.container.signature.keystore.path=classpath:/keystores/connector-keystore.jks
connector.container.signature.keystore.password=12345
connector.container.signature.keystore.type=JKS
connector.container.signature.private-key.alias=connector_blue
connector.container.signature.private-key.password=12345

##################################################################################
################## BUSINESS DOCUMENT VALIDATION CONFIGURATIONS ###################
##################################################################################
# business document validation
connector.business-document.service-provider=TestProvider
connector.business-document.country=BL
connector.business-document.default-advanced-system-type=AUTHENTICATION_BASED
connector.business-document.signature.validation.truststore.path=classpath:/keystores/connector-truststore.jks
connector.business-document.signature.validation.truststore.password=12345
connector.business-document.signature.validation.truststore.type=JKS
connector.business-document.signature.validation.constraints-xml=classpath:/102853/constraint.xml
connector.business-document.authentication-validation.identity-provider=ERV

##################################################################################
############################# LINK PARTNERS CONFIGURATIONS #######################
##################################################################################
# backends
connector.link.backend[0].link-config.name=default_backend
connector.link.backend[0].link-config.properties.endpoint.keystore.path=classpath:/keystores/backend-keystore.jks
connector.link.backend[0].link-config.properties.endpoint.keystore.password=12345
connector.link.backend[0].link-config.properties.endpoint.private-key.alias=connector_blue
connector.link.backend[0].link-config.properties.endpoint.private-key.password=12345
connector.link.backend[0].link-config.properties.endpoint.truststore.path=classpath:/keystores/backend-truststore.jks
connector.link.backend[0].link-config.properties.endpoint.truststore.password=12345
connector.link.backend[0].link-config.properties.endpoint.encrypt-alias=alice
connector.link.backend[0].link-config.properties.logging-enabled=true
# link partner 0 specific configuration
# this name must match any message routing config
# this name will also be stored into the DB to the specific message as its backend name
connector.link.backend[0].link-partners[0].name=backend_alice
connector.link.backend[0].link-partners[0].description=backend alice
connector.link.backend[0].link-partners[0].enabled=true
#this linkPartner operates in push receiveMode (connector pushes new messages to backend)
connector.link.backend[0].link-partners[0].sender-mode=push
# this must match the certificate alias within the trust-store
connector.link.backend[0].link-partners[0].properties.encryption-alias=alice
# this must match the certificate DN (lower- or UPPERcase is ignored)
connector.link.backend[0].link-partners[0].properties.certificate-dn=cn=alice
connector.link.backend[0].link-partners[0].properties.push-address=http://localhost:5001/services/domibusConnectorDeliveryWebservice

################################################################################
############################ CONNECTOR-BACKEND-ROUTING #########################
################################################################################
#Routing configuration to which gateway, backend is the message transported?
connector.routing.enabled=true
connector.routing.default-backend-name=backend_alice
connector.routing.backend-rules[0].link-name=backend_alice
connector.routing.backend-rules[0].match-clause=equals(ServiceName, 'Test')

################################################################################
############################ CONNECTOR-BACKEND-AUTHENTICATION ##################
################################################################################
connector.auth.security.jwt.secret=TKfopYnLbi4lCospwYxzWv2Hf4JKv2JepfN7n5lYwcE=
connector.auth.security.jwt.expiration=15m
connector.auth.security.jwt.issuer=connector.ecodex.eu
connector.auth.security.jwt.refresh-token.expiration=30d
connector.auth.security.jwt.refresh-token.cleanup-cron=0 0 3 * * *
connector.admin.username=admin
connector.admin.password=123456
connector.admin.enabled=true
connector.admin.email=testadmin@test.com

connector.scheduling.enabled=false

spring.autoconfigure.exclude=org.apache.cxf.spring.boot.autoconfigure.micrometer.MicrometerMetricsAutoConfiguration
