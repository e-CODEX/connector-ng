name: CI Pipeline

on:
    push:
    pull_request:
    merge_group:

env:
    SBOM_PATH: 'build/reports/cyclonedx/bom.xml'
    COVERAGE_PATH: 'build/reports/jacoco/jacocoRootReport'

jobs:
    unit-test:
        name: Test on ${{ matrix.os }} and JDK 21
        permissions:
            contents: read
        strategy:
            matrix:
                os: [ ubuntu-latest ]
                java-version: [ 21 ]
        runs-on: ${{ matrix.os }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Setup Java
                uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
                with:
                    distribution: 'temurin'
                    java-version: 21
                    cache: gradle

            -   name: Make Gradle wrapper executable
                if: runner.os != 'Windows'
                run: chmod +x ./gradlew

            -   name: Run tests with Gradle
                run: ./gradlew test
                shell: bash

            -   name: Upload JaCoCo execution data
                if: ${{ !cancelled() }}
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: jacoco-exec-unit
                    path: '**/build/jacoco/*.exec'

    integration-tests:
        name: Integration Tests (Linux only)
        permissions:
            contents: read
        runs-on: ubuntu-latest # Docker/Testcontainers works reliably here
        timeout-minutes: 20
        steps:
            -   name: Checkout code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Setup Java
                uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
                with:
                    distribution: 'temurin'
                    java-version: 21
                    cache: gradle

            -   name: Make Gradle wrapper executable
                run: chmod +x ./gradlew

            -   name: Run integration tests with Gradle
                run: ./gradlew integrationTest
                shell: bash

            -   name: Upload JaCoCo execution data
                if: ${{ !cancelled() }}
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: jacoco-exec-integration
                    path: '**/build/jacoco/*.exec'

    coverage:
        name: Coverage report and badges
        needs: [unit-test, integration-tests]
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Setup Java
                uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
                with:
                    distribution: 'temurin'
                    java-version: 21
                    cache: gradle

            -   name: Make Gradle wrapper executable
                run: chmod +x ./gradlew

            -   name: Download JaCoCo execution data
                uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
                with:
                    pattern: jacoco-exec-*
                    merge-multiple: true
                    path: .

            -   name: Generate merged JaCoCo report
                run: ./gradlew jacocoRootReport -x test -x integrationTest
                shell: bash

            -   name: Generate JaCoCo Badge
                uses: cicirello/jacoco-badge-generator@72266185b7ee48a6fd74eaf0238395cc8b14fef8
                with:
                    generate-branches-badge: true
                    jacoco-csv-file: ${{ env.COVERAGE_PATH }}/jacocoRootReport.csv
                    badges-directory: .github/badges

            -   name: Upload coverage report
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: coverage-report-${{ github.run_number }}
                    path: ${{ env.COVERAGE_PATH }}/html

            -   name: Commit coverage badges
                if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
                shell: bash
                run: |
                    if [[ -n "$(git status --porcelain .github/badges)" ]]; then
                        git config user.name "github-actions[bot]"
                        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                        git add .github/badges/*.svg
                        git commit -m "chore: update coverage badges [skip ci]"
                        git pull --rebase
                        git push
                    fi

    build:
        name: Build artifact and SBOM using Java 21
        permissions:
            contents: read
        runs-on: ubuntu-latest
        needs: [unit-test, integration-tests]
        steps:
            -   name: Checkout code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Setup Java
                uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
                with:
                    distribution: 'temurin'
                    java-version: 21
                    cache: gradle

            -   name: Install Graphviz
                uses: e-CODEX/workflows/.github/actions/install-graphviz@main

            -   name: Make Gradle wrapper executable
                run: chmod +x ./gradlew

            -   name: Build with Gradle
                run: ./gradlew build --no-configuration-cache -x test -x integrationTest
                shell: bash

            -   name: Verify SBOM exists
                run: test -f "${{ env.SBOM_PATH }}"

            -   name: Upload SBOM to GitHub as an artifact
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: sbom-${{ github.job }}-${{ runner.os }}-21-${{ github.run_number }}
                    path: ${{ env.SBOM_PATH }}

            -   name: Upload build artifacts
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: gradle-build-${{ github.job }}-${{ runner.os }}-21-${{ github.run_number }}
                    path: build/libs/*.jar
