# version: "3.8"
services:
    connector-ng-db:
        container_name: mysql
        # can be replaced with the appropriate database image. e.g. postgres
        image: mysql:8
        restart: always
        environment:
            # can be replaced with the appropriate database env. e.g. POSTGRES_PASSWORD, POSTGRES_USER ...
            MYSQL_DATABASE: connector
            MYSQL_USER: connector
            MYSQL_PASSWORD: connector
            MYSQL_ROOT_PASSWORD: connector
        ports:
            - "30006:3306"
        expose:
            - "3306"
        healthcheck:
            test: [ 'CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD' ]
            interval: 3s
            retries: 5
            timeout: 5s
        volumes:
            # based on your DBMS, initial scripts can be found in documentation/database-scripts/initial
            # copy and place them in sql folder
            # - ./sql/:/docker-entrypoint-initdb.d/
            - connector-ng-mysql-data:/var/lib/mysql
    minio-s3:
        image: minio/minio:latest
        container_name: minio
        ports:
            - "9000:9000"      # S3 API
            - "9001:9001"      # Web Console
        environment:
            MINIO_ROOT_USER: admin
            MINIO_ROOT_PASSWORD: admin123
        command: server /data --console-address ":9001"
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/ready" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s
        volumes:
            - minio_data:/data
    activemq:
        image: apache/activemq-classic:6.2.0
        container_name: activemq
        ports:
            - "8161:8161"   # Web console
            - "61616:61616" # OpenWire
        environment:
            ACTIVEMQ_CONNECTION_USER: admin
            ACTIVEMQ_CONNECTION_PASSWORD: admin
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8161" ]
            interval: 10s
            timeout: 5s
            retries: 5
        volumes:
            - activemq-data:/var/lib/activemq/data
    connector-ng:
        container_name: connector-ng
        # uncomment the bellow section if you want to build your connector image during the launch of docker-compose
        # build:
        #   context: ./
        #   dockerfile: Dockerfile
        image: connector-ng:latest
        depends_on:
            connector-ng-db:
                condition: service_healthy
            minio-s3:
                condition: service_started
        env_file:
            -   ./docker.env
        ports:
            - "30000:30000"
        expose:
            -   "30000"
        volumes:
            - ./data:/app/data
volumes:
    connector-ng-mysql-data:
    minio_data:
    activemq-data:
