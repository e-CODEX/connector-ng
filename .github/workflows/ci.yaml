name: CI Pipeline

on:
    push:
    pull_request:
    merge_group:

env:
    SBOM_PATH: 'build/reports/cyclonedx/bom.xml'
    COVERAGE_PATH: 'build/reports/jacoco/jacocoRootReport'

jobs:
    unit-test:
        name: Test on ${{ matrix.os }} and JDK 21
        permissions:
            contents: write
            pull-requests: write # required for updating PR comments
        strategy:
            matrix:
                os: [ ubuntu-latest ]
                java-version: [ 21 ]
        runs-on: ${{ matrix.os }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            -   name: Setup Java
                uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
                with:
                    distribution: 'temurin'
                    java-version: 21
                    cache: gradle

            -   name: Make Gradle wrapper executable
                if: runner.os != 'Windows'
                run: chmod +x ./gradlew

            -   name: Run tests with Gradle
                run: ./gradlew test
                shell: bash

            -   name: Generate JaCoCo code coverage
                if: ${{ runner.os == 'Linux' }}
                run: ./gradlew jacocoRootReport
                shell: bash

            -   name: Generate JaCoCo Badge
                if: ${{ runner.os == 'Linux' }}
                uses: cicirello/jacoco-badge-generator@72266185b7ee48a6fd74eaf0238395cc8b14fef8
                with:
                    generate-branches-badge: true
                    jacoco-csv-file: ${{ env.COVERAGE_PATH }}/jacocoRootReport.csv

            -   name: Upload coverage report
                if: ${{ runner.os == 'Linux' }}
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                with:
                    name: coverage-report-${{ github.job }}-${{ matrix.os }}-21-${{ github.run_number }}
                    path: ${{ env.COVERAGE_PATH }}/html
    integration-tests:
        name: Integration Tests (Linux only)
        permissions:
            contents: read
        runs-on: ubuntu-latest # Docker/Testcontainers works reliably here
        timeout-minutes: 20
        steps:
            -   name: Checkout code
                uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            -   name: Setup Java
                uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
                with:
                    distribution: 'temurin'
                    java-version: 21
                    cache: gradle

            -   name: Make Gradle wrapper executable
                run: chmod +x ./gradlew

            -   name: Run integration tests with Gradle
                run: ./gradlew integrationTest
                shell: bash
    build:
        name: Build artifact and SBOM using Java 21
        permissions:
            contents: read
        runs-on: ubuntu-latest
        needs: [unit-test, integration-tests]
        steps:
            -   name: Checkout code
                uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            -   name: Setup Java
                uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
                with:
                    distribution: 'temurin'
                    java-version: 21
                    cache: gradle

            -   name: Install Graphviz
                uses: e-CODEX/workflows/.github/actions/install-graphviz@main

            -   name: Make Gradle wrapper executable
                run: chmod +x ./gradlew

            -   name: Build with Gradle
                run: ./gradlew build -x test -x integrationTest
                shell: bash

            -   name: Verify SBOM exists
                run: test -f "${{ env.SBOM_PATH }}"

            -   name: Upload SBOM to GitHub as an artifact
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                with:
                    name: sbom-${{ github.job }}-${{ runner.os }}-21-${{ github.run_number }}
                    path: ${{ env.SBOM_PATH }}

            -   name: Upload build artifacts
                uses: actions/upload-artifact@v4
                with:
                    name: gradle-build-${{ github.job }}-${{ runner.os }}-21-${{ github.run_number }}
                    path: build/libs/*.jar
