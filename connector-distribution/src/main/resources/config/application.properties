##################################################################################
####################################### APP INFO #################################
##################################################################################
spring.application.name=e-CODEX Connector NG
spring.application.version=1.0.0
spring.banner.location=file:./config/banner.txt

# an external logging config file could be used by setting the property
# a custom log4j2 file could have micrometer tracing enabled
logging.config=file:./config/log4j2.xml

server.port=30000
server.address=0.0.0.0

##################################################################################
############################### DATABASE CONFIGURATIONS ##########################
##################################################################################
spring.datasource.agroal.xa=true
spring.datasource.agroal.driver-class-name=${DB_DRIVER_CLASSNAME}
spring.jpa.database-platform=${DB_DIALECT}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.agroal.xa.data-source-class-name=com.mysql.cj.jdbc.MysqlXADataSource

spring.datasource.agroal.min-size=5
spring.datasource.agroal.max-size=20

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# XA-capable driver (make sure to add the corresponding driver to the classpath)
# for H2
# spring.datasource.agroal.xa.data-source-class-name=org.h2.jdbcx.JdbcDataSource
# for MySQL
# spring.datasource.agroal.xa.data-source-class-name=com.mysql.cj.jdbc.MysqlXADataSource
# for MariaDB
# spring.datasource.agroal.xa.data-source-class-name=org.mariadb.jdbc.MariaDbDataSource
# for Postgres
# spring.datasource.agroal.xa.data-source-class-name=org.postgresql.xa.PGXADataSource
# for Oracle
# spring.datasource.agroal.xa.data-source-class-name=oracle.jdbc.xa.client.OracleXADataSource

# Set proper db dialect
# H2 (tests)
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# MySQL
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# MariaDB
# spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
# Postgres
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Oracle
# spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

##################################################################################
############################### ACTIVE MQ CONFIGURATIONS #########################
##################################################################################
spring.activemq.broker-url=${BROKER_URL}
spring.activemq.user=${BROKER_USER}
spring.activemq.password=${BROKER_PASSWORD}

#spring.activemq.pool.enabled=false
spring.activemq.packages.trust-all=true

# jta config
spring.jta.enabled=true
# narayana config
# log dir default to transaction-logs
narayana.log-dir=transaction-logs
# sets the default transaction timeout in seconds
narayana.default-timeout=60
# defines how often (in **seconds**) the recovery manager scans for incomplete transactions
narayana.periodic-recovery-period=120
# sets the delay (in **seconds**) before retrying a failed recovery attempt.
narayana.recovery-backoff-period=10
# enable jms transaction support
narayana.messaginghub.enabled=true
narayana.messaginghub.pool-size=15
spring.jms.listener.min-concurrency=1
spring.jms.listener.max-concurrency=10
spring.jms.cache.enabled=false

# default to 5
# connector.activemq.address-settings.max-delivery-attempts=5
# default to 60s (60000)
# connector.activemq.address-settings.redelivery-delay=60000
#default to 2
# connector.activemq.address-settings.redelivery-multiplier=2

##################################################################################
################################ MULTIPART CONFIGURATIONS ########################
##################################################################################
# enable multipart uploads (enabled by default, but good to be explicit)
spring.servlet.multipart.enabled=true
# max file size (default is 1MB )
spring.servlet.multipart.max-file-size=200MB
# max request size (default is 10MB)
spring.servlet.multipart.max-request-size=210MB
# file size threshold after which files are written to disk
spring.servlet.multipart.file-size-threshold=0
server.tomcat.max-swallow-size=-1
# Temporary location for uploaded files
spring.servlet.multipart.location=${TEMP_DIR_LOCATION}

##################################################################################
############################### REST API DOC CONFIGURATIONS ######################
##################################################################################
# set to false disable swagger ui in the production environment
springdoc.swagger-ui.enabled=true
# set to false disable /v3/api-docs endpoint in the production environment
springdoc.api-docs.enabled=true

##################################################################################
################################# SOAP API CONFIGURATIONS ########################
##################################################################################
cxf.path=/services

##################################################################################
############################ BUSINESS DOMAIN CONFIGURATIONS ######################
##################################################################################
# default business domain configuration
# is not set, a default domain will be created by the connector on startup
connector.business-domains.initial.identifier=default_business_domain
connector.business-domains.initial.description=default business domain
connector.business-domains.initial.enabled=true

##################################################################################
############################# CONNECTOR QUEUES CONFIGURATIONS ####################
##################################################################################
connector.queues.outbound-message-staging-queue=connector.queues.outbound-message-staging-queue
connector.queues.outbound-message-processing-queue=connector.queues.outbound-message-processing-queue
connector.queues.outbound-evidence-trigger-queue=connector.queues.outbound-evidence-trigger-queue
connector.queues.inbound-message-processing-queue=connector.queues.inbound-message-processing-queue
connector.queues.inbound-evidence-trigger-queue=connector.queues.inbound-evidence-trigger-queue
connector.queues.backend-delivery-queue=connector.queues.backend-delivery-queue

##################################################################################
############################### GATEWAY QUEUES CONFIGURATIONS ####################
##################################################################################
connector.queues.gateway-submission-queue=domibus.backend.jms.inQueue
connector.queues.gateway-submission-reply-queue=domibus.backend.jms.replyQueue
connector.queues.gateway-reception-queue=domibus.backend.jms.outQueue

##################################################################################
############################ MESSAGE PROCESSING CONFIGURATIONS ###################
##################################################################################
# Whether REM evidence generated by the connector (e.g., submission acceptance/rejection,
# delivery/non-delivery evidence) is forwarded to the backend application or only kept/sent
# on the gateway side.
connector.message-processing.send-generated-evidences-to-backend=true
# Whether the connector auto-generates ebMS message IDs itself rather than relying on IDs
# supplied by the backend or gateway.
connector.message-processing.ebms-id-generator-enabled=true
# Domain suffix appended when generating ebMS message IDs (ebMS message IDs are typically formatted
# as <uuid>@<suffix>, similar to an email Message-ID). Only takes effect when the generator above
# is enabled.
connector.message-processing.ebms-id-suffix=connector.ecodex.eu
# Domain suffix used when generating other message identifiers (distinct from ebMS message
# IDs — likely used for things like conversation IDs or other AS4 identifier fields, depending on the
# connector's identifier scheme).
connector.message-processing.identifier-suffix=connector.ecodex.eu
# Domain suffix used specifically for transport-level identifiers. Again following the same
# <value>@<suffix> convention as the other two suffix settings above.
connector.message-processing.transport-id-suffix=connector.ecodex.eu
# How strictly outbound messages (connector → gateway/network) are
# verified before being sent. STRICT means full validation
connector.message-processing.outbound-verification-mode=STRICT
# How strictly inbound messages (network/gateway → connector) are verified upon receipt.
# RELAXED suggests the connector is more tolerant of inbound message issues
connector.message-processing.inbound-verification-mode=RELAXED

##################################################################################
############################## FILE STORAGE CONFIGURATIONS #######################
##################################################################################
# Master switch enabling S3-backed file storage. When true, the connector uses S3 as its file
# storage backend instead of whatever default/local provider would otherwise be used.
connector.file.storage.s3.enable=true
# S3 secret access key
connector.file.storage.s3.secret-key=${S3_SECRET_KEY}
# S3 access key ID
connector.file.storage.s3.access-key=${S3_ACCESS_KEY}
# AWS region the bucket lives in (e.g. "eu-west-1"). For non-AWS
# S3-compatible providers this may be a placeholder/arbitrary value.
connector.file.storage.s3.region=${S3_REGION}
# Name of the S3 bucket used to store files.
connector.file.storage.s3.bucket=${S3_BUCKET}
# S3 endpoint URL. Only needed when targeting a non-default AWS endpoint — e.g., a self-hosted
# S3-compatible service like MinIO or a specific regional/VPC endpoint.
connector.file.storage.s3.endpoint=${S3_ENDPOINT}

##################################################################################
######################### REM EVIDENCE CONFIG ####################################
##################################################################################
# Keystore holding the private key/cert used to sign evidence documents.
connector.evidences.signature.keystore.path=file:./config/keystores/connector-keystore.jks
# Keystore password.
connector.evidences.signature.keystore.password=12345
# Keystore format. JKS is the legacy Java format; PKCS12 is the more modern/portable alternative
# if you ever migrate the keystore.
connector.evidences.signature.keystore.type=JKS
# Alias of the key entry within the keystore used for signing evidence
connector.evidences.signature.private-key.alias=connector_blue
# Password for that specific private key entry.
connector.evidences.signature.private-key.password=12345
# Digest algorithm used when hashing the message payload that the evidence attests to
# (e.g., for proving payload integrity at the time of submission/delivery).
connector.evidences.signature.payload-digest-algorithm=SHA256

# Display name of the issuing party as it will appear in the evidence record.
connector.evidences.issuer.as4-party.name=Connector NG
# Contact/endpoint address for the issuing party.
connector.evidences.issuer.as4-party.endpoint-address=mailto:gateway@connector.example

# Issuer postal address — embedded in evidence as the legal/physical
# address of the issuing entity
connector.evidences.issuer.postal-address.street=Unknown Street 1
connector.evidences.issuer.postal-address.locality=Unknown
connector.evidences.issuer.postal-address.zip-code=0000
connector.evidences.issuer.postal-address.country=EU

##################################################################################
### DSS (Digital Signature Service) — trust list cache & network config ##########
##################################################################################
# cache configuration
# Local filesystem cache where DSS persists downloaded/parsed Trusted
# List (TL) and List of Trusted Lists (LOTL) data, so it doesn't have
# to re-fetch everything on every application restart.
# Format: Spring "file:" resource URI, relative to the working directory.
connector.dss.cache.location=file:./data/tlcache
# Max age of the cached trust data before DSS treats it as stale and
# re-downloads from the sources configured below.
# Format: Spring Boot duration shorthand (e.g. "1d", "12h", "30m").
connector.dss.cache.expiration=1d

# -----------------------------------------------------------------
# Proxy configuration (optional)
# -----------------------------------------------------------------
# Used only for DSS's outbound calls to fetch:
#   - LOTL / Trusted List XML
#   - CRL (Certificate Revocation List) updates
#   - OCSP (Online Certificate Status Protocol) responses
# Set host+port for HTTP and/or HTTPS if the environment requires
#connector.dss.proxy.http.host=proxy1.example.com
#connector.dss.proxy.http.port=8080
#connector.dss.proxy.https.host=proxy1.example.com
#connector.dss.proxy.https.port=8080

# LOTL source: the EU master list that points to each member state's
# national Trusted List.
#connector.dss.trust-list-sources.eu.lotl-sources[0].lotl-url=https://ec.europa.eu/tools/lotl/eu-lotl.xml

# URL of the Official Journal notice announcing the certificates used
# to verify the LOTL's own signature (the trust anchor for the LOTL).
#connector.dss.trust-list-sources.eu.lotl-sources[0].signing-certificates-announcement-uri=https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=uriserv:OJ.C_.2019.276.01.0001.01.ENG

# Enables pivot support, so DSS can follow historical LOTL "pivot"
# versions and keep trust anchors valid as the EU rotates LOTL
# signing certificates over time.
#connector.dss.trust-list-sources.eu.lotl-sources[0].pivot-support=true

# A standalone national Trusted List fetched directly (not via the LOTL).
#connector.dss.trust-list-sources.eu.tl-sources[0].tl-url=https://www.signatur.rtr.at/currenttl.xml

# -----------------------------------------------------------------
# Timestamp (TSA) servers (optional)
# -----------------------------------------------------------------
# RFC 3161 Time-Stamping Authority endpoints DSS can use when a
# signature needs a timestamp.
#connector.dss.time-stamp-servers.t1.url=http://dss.nowina.lu/pki-factory/tsa/good-tsa
#connector.dss.time-stamp-servers.ee-good-tsa.url=http://dss.nowina.lu/pki-factory/tsa/ee-good-tsa

##################################################################################
######################## CONTAINER CONFIGURATIONS ################################
##################################################################################
# Settings for the security library for generating the Token.
# Path to the Java KeyStore (JKS) holding the private key/certificate
# used to SIGN containers (as opposed to validating them).
connector.container.signature.keystore.path=file:./config/keystores/connector-keystore.jks
# Password protecting the keystore file itself.
connector.container.signature.keystore.password=12345
# Keystore format. JKS is the legacy Java format; PKCS12 is the more
# modern/portable alternative if you ever migrate the keystore.
connector.container.signature.keystore.type=JKS
# Alias identifying which key entry inside the keystore to use for
# signing (a keystore can hold multiple key pairs/certs).
connector.container.signature.private-key.alias=connector_blue
# Password protecting that specific private key entry
connector.container.signature.private-key.password=12345

##################################################################################
################## BUSINESS DOCUMENT VALIDATION CONFIGURATIONS ###################
##################################################################################
# business document validation
# Identifier of the service provider issuing/handling the business document.
connector.business-document.service-provider=TestProvider
# Two-letter country code associated with this connector instance for business document processing.
connector.business-document.country=BL
# Default type of "advanced" electronic system used to qualify the document/transaction.
# AUTHENTICATION_BASED is also applicable
connector.business-document.default-advanced-system-type=SIGNATURE_BASED
# Truststore containing the trusted certificates/CA chains used to
# validate signatures on incoming business documents
connector.business-document.signature.validation.truststore.path=file:./config/keystores/connector-truststore.jks
# Password protecting the truststore.
connector.business-document.signature.validation.truststore.password=12345
# Truststore format (JKS legacy format, as with the signing keystore).
# PKCS12 is the more modern/portable alternative if you ever migrate the truststore.
connector.business-document.signature.validation.truststore.type=JKS
# Same ETSI/eCodex validation policy file (102853) used here to
# constrain which signature/digest algorithms and certificate
# qualities are accepted when validating business document signatures.
connector.business-document.signature.validation.constraints-xml=classpath:/102853/constraint.xml
# Identity provider used to validate authentication claims attached
# to the business document.
connector.business-document.authentication-validation.identity-provider=ERV

##################################################################################
############################# LINK PARTNERS CONFIGURATIONS #######################
##################################################################################
# backends
connector.link.backend[0].link-config.name=default_backend

connector.link.backend[0].link-config.properties.publish-address=/backend
connector.link.backend[0].link-config.properties.ws-policy=classpath:/policy/backend.policy.xml
connector.link.backend[0].link-config.properties.logging-enabled=true

connector.link.backend[0].link-config.properties.endpoint.keystore.path=file:./config/keystores/backend-keystore.jks
connector.link.backend[0].link-config.properties.endpoint.keystore.password=12345
connector.link.backend[0].link-config.properties.endpoint.private-key.alias=connector_blue
connector.link.backend[0].link-config.properties.endpoint.private-key.password=12345

connector.link.backend[0].link-config.properties.endpoint.truststore.path=file:./config/keystores/backend-truststore.jks
connector.link.backend[0].link-config.properties.endpoint.truststore.password=12345
connector.link.backend[0].link-config.properties.endpoint.encrypt-alias=alice

# link partner 0 specific configuration
# this name must match any message routing config
# this name will also be stored into the DB to the specific message as its backend name
connector.link.backend[0].link-partners[0].name=backend_alice
connector.link.backend[0].link-partners[0].description=backend alice
connector.link.backend[0].link-partners[0].enabled=true
#this linkPartner operates in push receiveMode (connector pushes new messages to backend)
connector.link.backend[0].link-partners[0].sender-mode=push
# this must match the certificate alias within the trust-store
connector.link.backend[0].link-partners[0].properties.encryption-alias=alice
# this must match the certificate DN (lower- or UPPERcase is ignored)
connector.link.backend[0].link-partners[0].properties.certificate-dn=cn=alice
connector.link.backend[0].link-partners[0].properties.push-address=http://localhost:9082/services/domibusConnectorDeliveryWebservice

################################################################################
############################ CONNECTOR-BACKEND-ROUTING #########################
################################################################################
# Routing configuration to which backend is the message transported?
# Master switch for message routing logic. When false, routing rules below are presumably ignored
connector.routing.enabled=true
# Fallback backend link to use when no routing rule below matches an
# incoming message. Acts as the catch-all destination.
connector.routing.default-backend-name=backend_alice
# -----------------------------------------------------------------
# Routing rules (indexed array — [0], [1], ... for multiple rules)
# -----------------------------------------------------------------
# Each rule pairs a target backend link with a match condition.
# Rules are evaluated in order, and the first matching rule's
# link-name determines where the message is routed.
# Match-clause syntax looks like a small expression DSL — equals(field, 'value')
# — supporting routing decisions based on message metadata.
connector.routing.backend-rules[0].link-name=backend_alice
connector.routing.backend-rules[0].match-clause=equals(ServiceName, 'Test')
