##################################################################################
############################## FILE STORAGE CONFIGURATIONS #######################
##################################################################################
connector.file.storage.s3.enable=true
connector.file.storage.s3.access-key=admin
connector.file.storage.s3.secret-key=admin
connector.file.storage.s3.region=us-east-1
connector.file.storage.s3.bucket=attachments
connector.file.storage.s3.endpoint=http://localhost:2000

##################################################################################
################################ MULTIPART CONFIGURATIONS ########################
##################################################################################
# TODO these value will be up to date once the connector will start processing messages
# enable multipart uploads (enabled by default, but good to be explicit)
spring.servlet.multipart.enabled=true
# max file size (default is 1MB )
spring.servlet.multipart.max-file-size=200MB
# max request size (default is 10MB)
spring.servlet.multipart.max-request-size=200MB
# file size threshold after which files are written to disk
spring.servlet.multipart.file-size-threshold=0
# Temporary location for uploaded files
spring.servlet.multipart.location=./temp
