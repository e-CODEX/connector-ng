##################################################################################
############################ BUSINESS DOMAIN CONFIGURATIONS ######################
##################################################################################
# default business domain configuration
# is not set, a default domain will be created by the connector on startup
connector.business-domains.initial.identifier=default_business_domain
connector.business-domains.initial.description=default business domain
connector.business-domains.initial.enabled=true

# database configuration
spring.datasource.driver-class-name=${DB_DRIVER_CLASSNAME}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# TODO these value will be up to date once the connector will start processing messages
# enable multipart uploads (enabled by default, but good to be explicit)
spring.servlet.multipart.enabled=true
# max file size (default is 1MB )
spring.servlet.multipart.max-file-size=10MB
# max request size (default is 10MB)
spring.servlet.multipart.max-request-size=10MB
# file size threshold after which files are written to disk
spring.servlet.multipart.file-size-threshold=2KB
# Temporary location for uploaded files
spring.servlet.multipart.location=${java.io.tmpdir}

# an external logging config file could be used by setting the property
# a custom log4j2 file could have micrometer tracing enabled
logging.config=classpath:log4j2-spring.xml

# set to false disable swagger ui in the production environment
springdoc.swagger-ui.enabled=true
# set to false disable /v3/api-docs endpoint in the production environment
springdoc.api-docs.enabled=true

server.port=9090
server.address=0.0.0.0
