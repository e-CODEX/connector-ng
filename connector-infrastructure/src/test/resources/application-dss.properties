##################################################################################
######################### DSS TOOL CONFIGURATIONS ################################
##################################################################################
# cache configuration
connector.dss.cache.location=file:./data/tlcache
connector.dss.cache.expiration=1d

connector.dss.proxy.http.host=proxy1.example.com
connector.dss.proxy.http.port=8080
connector.dss.proxy.https.host=proxy1.example.com
connector.dss.proxy.https.port=8080

connector.dss.trust-list-sources.eu.lotl-sources[0].lotl-url=https://ec.europa.eu/tools/lotl/eu-lotl.xml
connector.dss.trust-list-sources.eu.lotl-sources[0].signing-certificates-announcement-uri=https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=uriserv:OJ.C_.2019.276.01.0001.01.ENG
connector.dss.trust-list-sources.eu.lotl-sources[0].pivot-support=true
connector.dss.trust-list-sources.eu.tl-sources[0].tl-url=https://www.signature.rtr.at/currenttl.xml
connector.dss.time-stamp-servers.t1.url=http://dss.nowina.lu/pki-factory/tsa/good-tsa
connector.dss.time-stamp-servers.ee-good-tsa.url=http://dss.nowina.lu/pki-factory/tsa/ee-good-tsa

##################################################################################
######################### REM EVIDENCE CONFIG ####################################
##################################################################################
connector.evidences.signature.keystore.path=classpath:keystores/connector-keystore.jks
connector.evidences.signature.keystore.password=12345
connector.evidences.signature.keystore.type=JKS
connector.evidences.signature.private-key.alias=connector_blue
connector.evidences.signature.private-key.password=12345
connector.evidences.signature.payload-digest-algorithm=SHA256

connector.evidences.issuer.as4-party.name=Test Gateway
connector.evidences.issuer.as4-party.endpoint-address=mailto:test@connector.example
connector.evidences.issuer.postal-address.street=Test Street 1
connector.evidences.issuer.postal-address.locality=Brussels
connector.evidences.issuer.postal-address.zip-code=1000
connector.evidences.issuer.postal-address.country=BE

spring.autoconfigure.exclude=org.apache.cxf.spring.boot.autoconfigure.micrometer.MicrometerMetricsAutoConfiguration
